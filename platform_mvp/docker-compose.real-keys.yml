services:
  keygen:
    build: .
    command:
      - python
      - keygen.py
      - --nodes
      - node0,node1,node2
      - --output-dir
      - /keys
      - --overwrite
    volumes:
      - real-keys:/keys

  node0:
    build: .
    depends_on:
      keygen:
        condition: service_completed_successfully
    environment:
      DFL_NODE_ID: node0
      DFL_PORT: "9000"
      DFL_EXPERIMENT_ID: docker_real_keys_demo
      DFL_PEERS_JSON: '{"node1":"http://node1:9000","node2":"http://node2:9000"}'
      DFL_DATA_DIR: /data
      DFL_ADMIN_TOKEN: real-keys-demo-admin
      DFL_PRIVATE_KEY_FILE: /keys/nodes/node0_private_key.pem
      DFL_TRUSTED_KEYS_FILE: /keys/trusted_keys.json
      DFL_SECURITY_MODE: ${DFL_DOCKER_SECURITY_MODE:-pairwise_masking}
      DFL_MIN_PEER_UPDATES_TO_FINALIZE: "2"
    ports: ["9100:9000"]
    volumes:
      - real-keys:/keys:ro
      - real-node0-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 20

  node1:
    build: .
    depends_on:
      keygen:
        condition: service_completed_successfully
    environment:
      DFL_NODE_ID: node1
      DFL_PORT: "9000"
      DFL_EXPERIMENT_ID: docker_real_keys_demo
      DFL_PEERS_JSON: '{"node0":"http://node0:9000","node2":"http://node2:9000"}'
      DFL_DATA_DIR: /data
      DFL_ADMIN_TOKEN: real-keys-demo-admin
      DFL_PRIVATE_KEY_FILE: /keys/nodes/node1_private_key.pem
      DFL_TRUSTED_KEYS_FILE: /keys/trusted_keys.json
      DFL_SECURITY_MODE: ${DFL_DOCKER_SECURITY_MODE:-pairwise_masking}
      DFL_MIN_PEER_UPDATES_TO_FINALIZE: "2"
    ports: ["9101:9000"]
    volumes:
      - real-keys:/keys:ro
      - real-node1-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 20

  node2:
    build: .
    depends_on:
      keygen:
        condition: service_completed_successfully
    environment:
      DFL_NODE_ID: node2
      DFL_PORT: "9000"
      DFL_EXPERIMENT_ID: docker_real_keys_demo
      DFL_PEERS_JSON: '{"node0":"http://node0:9000","node1":"http://node1:9000"}'
      DFL_DATA_DIR: /data
      DFL_ADMIN_TOKEN: real-keys-demo-admin
      DFL_PRIVATE_KEY_FILE: /keys/nodes/node2_private_key.pem
      DFL_TRUSTED_KEYS_FILE: /keys/trusted_keys.json
      DFL_SECURITY_MODE: ${DFL_DOCKER_SECURITY_MODE:-pairwise_masking}
      DFL_MIN_PEER_UPDATES_TO_FINALIZE: "2"
    ports: ["9102:9000"]
    volumes:
      - real-keys:/keys:ro
      - real-node2-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 20

  dashboard:
    build: .
    depends_on:
      node0:
        condition: service_healthy
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
    command:
      - python
      - operator_dashboard.py
      - --nodes
      - node0=http://node0:9000,node1=http://node1:9000,node2=http://node2:9000
      - --host
      - 0.0.0.0
      - --port
      - "9200"
      - --admin-token
      - docker-dashboard-token
    ports: ["9200:9200"]

  demo:
    build: .
    depends_on:
      node0:
        condition: service_healthy
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
    command:
      - python
      - -m
      - secure_dfl_platform.orchestrator
      - --nodes
      - node0=http://node0:9000,node1=http://node1:9000,node2=http://node2:9000
      - --rounds
      - "3"
      - --admin-token
      - real-keys-demo-admin

  audit_verifier:
    build: .
    depends_on:
      demo:
        condition: service_completed_successfully
    command:
      - python
      - verify_audit_logs.py
      - --runtime-dir
      - /audit
      - --trusted-keys
      - /keys/trusted_keys.json
      - --output
      - /reports/docker_real_keys_audit_verification.json
    volumes:
      - real-keys:/keys:ro
      - real-node0-data:/audit/node0:ro
      - real-node1-data:/audit/node1:ro
      - real-node2-data:/audit/node2:ro
      - real-reports:/reports

volumes:
  real-keys:
  real-node0-data:
  real-node1-data:
  real-node2-data:
  real-reports:
